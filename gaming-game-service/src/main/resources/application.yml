server:
  port: 8081

spring:
  application:
    name: gaming-game-service

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://${SPRING_R2DBC_HOST:${POSTGRES_HOST:localhost}}:${SPRING_R2DBC_PORT:${POSTGRES_PORT:5432}}/${SPRING_R2DBC_DATABASE:${POSTGRES_DB:gamedb}}}
    username: ${SPRING_R2DBC_USERNAME:${POSTGRES_USER:gameapp}}
    password: ${SPRING_R2DBC_PASSWORD:${POSTGRES_PASSWORD:password123}}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 15m
      validation-query: SELECT 1

  database:
    initialize: ${DATABASE_INITIALIZE:false}
    schema-location: ${DATABASE_SCHEMA_LOCATION:schema.sql}

logging:
  level:
    com.gaming.gameservice: INFO
    org.springframework.r2dbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: Gaming Game Service
    description: Microservicio para gestion de videojuegos
    version: 1.0.0
