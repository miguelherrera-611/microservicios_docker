server:
  port: 8081

spring:
  application:
    name: gaming-game-service

  r2dbc:
    url: r2dbc:postgresql://gamedb:5432/gamedb
    username: gameapp
    password: password123
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 15m
      validation-query: SELECT 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gaming.gameservice: INFO
    org.springframework.r2dbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: Gaming Game Service
    description: Microservicio para gestion de videojuegos
    version: 1.0.0