services:
  # API Gateway
  - type: web
    name: gaming-api-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GAME_SERVICE_URL
        value: https://gaming-game-service.onrender.com
      - key: USER_SERVICE_URL
        value: https://gaming-user-service.onrender.com
      - key: REVIEW_SERVICE_URL
        value: https://gaming-review-service.onrender.com

  # Game Service
  - type: web
    name: gaming-game-service
    env: docker
    dockerfilePath: ./gaming-game-service/Dockerfile
    dockerContext: ./gaming-game-service
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_INITIALIZE
        value: "false"
      - key: SPRING_R2DBC_HOST
        fromDatabase:
          name: gamedb
          property: host
      - key: SPRING_R2DBC_PORT
        fromDatabase:
          name: gamedb
          property: port
      - key: SPRING_R2DBC_DATABASE
        fromDatabase:
          name: gamedb
          property: database
      - key: SPRING_R2DBC_USERNAME
        fromDatabase:
          name: gamedb
          property: user
      - key: SPRING_R2DBC_PASSWORD
        fromDatabase:
          name: gamedb
          property: password

  # User Service
  - type: web
    name: gaming-user-service
    env: docker
    dockerfilePath: ./gaming-user-service/Dockerfile
    dockerContext: ./gaming-user-service
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_INITIALIZE
        value: "false"
      - key: SPRING_R2DBC_HOST
        fromDatabase:
          name: userdb
          property: host
      - key: SPRING_R2DBC_PORT
        fromDatabase:
          name: userdb
          property: port
      - key: SPRING_R2DBC_DATABASE
        fromDatabase:
          name: userdb
          property: database
      - key: SPRING_R2DBC_USERNAME
        fromDatabase:
          name: userdb
          property: user
      - key: SPRING_R2DBC_PASSWORD
        fromDatabase:
          name: userdb
          property: password

  # Review Service
  - type: web
    name: gaming-review-service
    env: docker
    dockerfilePath: ./gaming-review-service/Dockerfile
    dockerContext: ./gaming-review-service
    plan: starter
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_INITIALIZE
        value: "false"
      - key: SPRING_R2DBC_HOST
        fromDatabase:
          name: reviewdb
          property: host
      - key: SPRING_R2DBC_PORT
        fromDatabase:
          name: reviewdb
          property: port
      - key: SPRING_R2DBC_DATABASE
        fromDatabase:
          name: reviewdb
          property: database
      - key: SPRING_R2DBC_USERNAME
        fromDatabase:
          name: reviewdb
          property: user
      - key: SPRING_R2DBC_PASSWORD
        fromDatabase:
          name: reviewdb
          property: password

databases:
  - name: gamedb
    databaseName: gamedb
    user: gameapp
    plan: starter

  - name: userdb
    databaseName: userdb
    user: gameapp
    plan: starter

  - name: reviewdb
    databaseName: reviewdb
    user: gameapp
    plan: starter
