server:
  port: 8083

spring:
  application:
    name: gaming-review-service

  r2dbc:
    url: r2dbc:postgresql://reviewdb:5432/reviewdb
    username: gameapp
    password: password123
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 15m
      validation-query: SELECT 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gaming.reviewservice: INFO
    org.springframework.r2dbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: Gaming Review Service
    description: Microservicio para gestion de resenas de videojuegos
    version: 1.0.0