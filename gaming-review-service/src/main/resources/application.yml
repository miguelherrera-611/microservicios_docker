server:
  port: ${PORT:8083}

spring:
  application:
    name: gaming-review-service

  r2dbc:
    url: r2dbc:postgresql://${SPRING_R2DBC_HOST:${POSTGRES_HOST:localhost}}:${SPRING_R2DBC_PORT:${POSTGRES_PORT:5432}}/${SPRING_R2DBC_DATABASE:${POSTGRES_DB:reviewdb}}}
    username: ${SPRING_R2DBC_USERNAME:${POSTGRES_USER:gameapp}}
    password: ${SPRING_R2DBC_PASSWORD:${POSTGRES_PASSWORD:password123}}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 15m
      validation-query: SELECT 1

  database:
    initialize: ${DATABASE_INITIALIZE:false}
    schema-location: ${DATABASE_SCHEMA_LOCATION:schema.sql}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gaming.reviewservice: INFO
    org.springframework.r2dbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: Gaming Review Service
    description: Microservicio para gestion de resenas de videojuegos
    version: 1.0.0