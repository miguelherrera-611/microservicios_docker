server:
  port: 8080

spring:
  application:
    name: gaming-api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      discovery:
        locator:
          enabled: false

      httpclient:
        connect-timeout: 5000
        response-timeout: 10000

# URLs de servicios - Por defecto apuntan a localhost para desarrollo en IntelliJ
services:
  game:
    url: ${GAME_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  review:
    url: ${REVIEW_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.gaming.gateway: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

info:
  app:
    name: Gaming API Gateway
    description: Gateway para microservicios de videojuegos
    version: 1.0.0
    profiles: ${spring.profiles.active:default}